<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="X-STREAM - Ultimate Premium Video Aggregator">
    <meta name="theme-color" content="#000000">
    <title>X-STREAM | Premium Streaming</title>
    <script src="auth.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body data-page="home" class="home-page">
    <div class="bg-glow"></div>

    <div id="age-gate" class="age-verification-overlay">
        <div class="age-gate-content">
            <h1><i class="fa-solid fa-triangle-exclamation"></i> Age Verification Required</h1>
            <p>You must be 18 years or older to access this content.</p>
            <label>
                <input type="checkbox" id="age-confirm-check">
                <span>I confirm I am 18+ and agree to the terms</span>
            </label>
            <button id="age-confirm-btn" disabled>ENTER PORTAL</button>
        </div>
    </div>

    <header class="modern-header">
        <div class="header-inner">
            <div class="brand" onclick="location.href='index.html'">
                <i class="fa-solid fa-bolt-lightning"></i> X-STREAM<span class="brand-badge">PRO</span>
            </div>

            <div class="search-bar">
                <form action="search.html" method="GET">
                    <div class="search-input-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon-inner"></i>
                        <input type="text" name="q" id="searchInput" placeholder="Search millions of videos..."
                            autocomplete="off">
                        <select name="type" id="searchType">
                            <option value="real">Real Life</option>
                            <option value="anime">Anime</option>
                        </select>
                        <div id="search-suggestions" class="search-suggestions"></div>
                    </div>
                </form>
            </div>

            <nav class="nav-links">
                <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i> <span>Home</span></a>
                <a href="real.html" class="nav-item"><i class="fa-solid fa-clapperboard"></i> <span>Videos</span></a>
                <a href="anime.html" class="nav-item"><i class="fa-solid fa-tv"></i> <span>Hentai</span></a>
                <a href="favorites.html" class="nav-item"><i class="fa-solid fa-heart"></i> <span>Favorites</span></a>
                <a href="#" onclick="handleLogout()" class="nav-item nav-item-logout"><i
                        class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a>
            </nav>
        </div>
    </header>

    <main>
        <!-- 🕒 Continue Watching (Synchronized) -->
        <div class="row-section" id="continue-watching-section" style="display: none; margin-bottom: 40px;">
            <div class="section-header">
                <h2 class="section-title"><i class="fa-solid fa-history" style="color: var(--primary);"></i> Continue
                    Watching</h2>
                <div class="continue-filters">
                    <button class="continue-filter-btn active" onclick="filterContinue('real')">Real</button>
                    <button class="continue-filter-btn" onclick="filterContinue('anime')">Anime</button>
                    <span class="filter-divider">|</span>
                    <button class="btn-clear-history" onclick="clearWatchHistory()" title="Clear History"><i
                            class="fa-solid fa-trash"></i> Clear All</button>
                </div>
            </div>
            <div class="horizontal-scroll" id="continueWatchingGrid">
                <!-- Cards injected by JS -->
            </div>
        </div>

        <!-- 🚀 Dynamic Source Sections (Generated via JS) -->
        <div id="dynamicHomeContent">
            <!-- Source-wise rows will be injected here -->
            <div class="initial-loader" style="display: flex; justify-content: center; align-items: center; padding: 150px 0;">
                <div class="spinner"></div>
            </div>
        </div>
    </main>


    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="script.js"></script>
</body>

</html>


</html>
